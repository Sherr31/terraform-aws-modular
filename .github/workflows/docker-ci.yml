# .github/workflows/docker-ci.yml
#
# Docker CI — validates the containerized application.
#
# Trigger: pull requests and pushes that affect apps/containerized-api/.
#
# Responsibilities:
#   - Build the Docker image
#   - Run application unit tests
#   - Run Docker Compose integration test
#   - Verify the health endpoint responds
#   - Scan the image for vulnerabilities with Trivy
#
# This workflow NEVER deploys to AWS and NEVER publishes images.
# Publishing is handled by docker-publish.yml (main branch only).
#
# Path filters ensure Terraform-only changes do not trigger this workflow.

name: Docker CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/containerized-api/**'
      - '.github/workflows/docker-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'apps/containerized-api/**'
      - '.github/workflows/docker-ci.yml'

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/containerized-api
  IMAGE_NAME: containerized-api

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Application unit tests (fast, no Docker needed)
  # ---------------------------------------------------------------------------
  # Runs first as a cheap gate. If the application logic is broken there is
  # no point building an image.

  unit-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run unit tests
        working-directory: ${{ env.APP_DIR }}
        # Tests must run from the app directory so the "app" package resolves.
        run: python3 -m unittest discover -v

  # ---------------------------------------------------------------------------
  # Job 2: Build the image
  # ---------------------------------------------------------------------------
  # Builds the image and exports it as an artifact so later jobs (compose test,
  # Trivy scan) reuse the exact same image instead of rebuilding it.

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image to tar
        run: docker save ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3: Docker Compose integration test
  # ---------------------------------------------------------------------------
  # Brings the service up with Compose, waits for the health check to pass,
  # verifies the endpoints, and tears it down.

  compose-test:
    name: Compose Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Start Compose stack
        working-directory: ${{ env.APP_DIR }}
        run: docker compose up -d

      - name: Wait for health check
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Poll container health for up to 60 seconds.
          # CI runners are sometimes slow, so don't fail on the first check.
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' containerized-api 2>/dev/null || echo "missing")
            echo "attempt $i: health=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time."
          docker compose logs api
          exit 1

      - name: Verify health endpoint
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS http://localhost:8080/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status": *"healthy"'

      - name: Verify info endpoint
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS http://localhost:8080/info)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"service": *"containerized-api"'

      - name: Verify 404 handling
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/404.json -w '%{http_code}' http://localhost:8080/nonexistent)
          echo "Status: $CODE"
          cat /tmp/404.json
          test "$CODE" = "404"

      - name: Show logs
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose logs api

      - name: Tear down
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Job 4: Trivy vulnerability scan
  # ---------------------------------------------------------------------------
  # Scans the built image for OS and library vulnerabilities.
  # Results are written to the job summary and uploaded as SARIF.
  #
  # severity: only HIGH and CRITICAL are reported, to keep signal-to-noise high.
  # ignore-unfixed: vulnerabilities with no available fix are not actionable.

  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      # Block the build only on CRITICAL, fixable vulnerabilities. Base images
      # regularly carry fixable HIGH findings in OS packages that the
      # application cannot control; blocking on those would make CI red
      # permanently and train people to ignore it. HIGH findings are still
      # reported via SARIF and the job summary.
      - name: Run Trivy (block on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy (SARIF output)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Scan summary
        if: always()
        run: |
          echo "## Docker Image Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            COUNT=$(grep -o '"ruleId"' trivy-results.sarif | wc -l || echo 0)
            echo "Findings recorded (HIGH/CRITICAL, fixable): **$COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full results: Security → Code scanning alerts." >> $GITHUB_STEP_SUMMARY
          else
            echo "No SARIF output produced." >> $GITHUB_STEP_SUMMARY
          fi
