name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: Select application
        required: true
        type: choice
        options:
          - app-one
          - app-two

      confirm:
        description: Select yes only when you want to deploy
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  plan:
    name: Generate Deployment Plan
    runs-on: ubuntu-latest
    environment: terraform-deployment

    defaults:
      run:
        working-directory: apps/${{ inputs.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::055111817997:role/github-actions-terraform-plan
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraformDeployPlan

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Generate saved plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.app }}
          path: apps/${{ inputs.app }}/tfplan
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Apply Terraform Plan
    runs-on: ubuntu-latest
    needs: plan

    if: ${{ inputs.confirm == 'yes' }}

    environment: production

    defaults:
      run:
        working-directory: apps/${{ inputs.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.app }}
          path: apps/${{ inputs.app }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::055111817997:role/github-actions-terraform-deploy
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraformApply

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve tfplan
