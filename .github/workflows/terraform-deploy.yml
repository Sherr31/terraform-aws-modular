# Terraform CD — manually deploy one selected AWS configuration.
name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Terraform root to deploy.
        required: true
        type: choice
        options:
          - examples/vpc
          - examples/ec2
          - examples/s3
          - examples/iam
          - examples/security-group
          - examples/alb
          - examples/autoscaling
          - examples/ecr
          - apps/infrastructure-lab
          - bootstrap/terraform-state
        default: examples/vpc
      extra_vars:
        description: Optional Terraform variables as a JSON object.
        required: false
        type: string
        default: '{}'

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-deploy-${{ inputs.configuration }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ inputs.configuration }}
    runs-on: ubuntu-latest
    outputs:
      plan_has_changes: ${{ steps.plan.outputs.plan_has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ inputs.configuration }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        working-directory: ${{ inputs.configuration }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ inputs.configuration }}
        run: terraform validate

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform plan
        id: plan
        working-directory: ${{ inputs.configuration }}
        env:
          TF_EXTRA_VARS: ${{ inputs.extra_vars }}
        run: |
          set -euo pipefail
          extra_args=()

          if [[ -n "$TF_EXTRA_VARS" && "$TF_EXTRA_VARS" != "{}" ]]; then
            if ! jq -e 'type == "object"' >/dev/null <<< "$TF_EXTRA_VARS"; then
              echo "extra_vars must be a JSON object." >&2
              exit 1
            fi
            while IFS= read -r arg; do
              extra_args+=("$arg")
            done < <(jq -r 'to_entries[] | "--var=\(.key)=\(.value|tostring)"' <<< "$TF_EXTRA_VARS")
          fi

          if terraform plan -input=false -out=tfplan -detailed-exitcode "${extra_args[@]}"; then
            echo "plan_has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to apply."
          else
            plan_exit_code=$?
            if [ "$plan_exit_code" -eq 2 ]; then
              echo "plan_has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Plan artifact will be available for review before approval."
            else
              echo "Terraform plan failed with exit code $plan_exit_code." >&2
              exit "$plan_exit_code"
            fi
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.plan_has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.configuration }}-${{ github.run_id }}
          path: ${{ inputs.configuration }}/tfplan
          if-no-files-found: error
          retention-days: 7

      - name: No changes summary
        if: steps.plan.outputs.plan_has_changes == 'false'
        run: echo "No infrastructure changes detected; apply was skipped." >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply ${{ inputs.configuration }}
    needs: plan
    if: needs.plan.outputs.plan_has_changes == 'true'
    runs-on: ubuntu-latest
    environment:
      name: terraform-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ inputs.configuration }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        working-directory: ${{ inputs.configuration }}
        run: terraform init -input=false

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.configuration }}-${{ github.run_id }}
          path: ${{ inputs.configuration }}

      - name: Terraform apply
        working-directory: ${{ inputs.configuration }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show outputs
        working-directory: ${{ inputs.configuration }}
        run: terraform output

      - name: Deployment summary
        run: |
          {
            echo "## Terraform deployment completed"
            echo "- Configuration: ${{ inputs.configuration }}"
            echo "- Plan artifact: tfplan-${{ inputs.configuration }}-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
