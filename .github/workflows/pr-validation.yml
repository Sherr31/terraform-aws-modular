# .github/workflows/pr-validation.yml
#
# Validates all Terraform configurations on every pull request.
#
# Jobs:
#   - terraform-fmt: checks formatting across all .tf files
#   - terraform-validate: initializes and validates each root configuration
#   - security-scan: scans for security issues with Checkov

name: Terraform PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.github/workflows/**'
      - 'apps/infrastructure-lab/**'
      - 'modules/**'
      - 'examples/**'
      - 'bootstrap/**'

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - examples/vpc
          - examples/ec2
          - examples/s3
          - examples/iam
          - examples/security-group
          - examples/alb
          - examples/autoscaling
          - examples/ecr
          - bootstrap/terraform-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: examples
          framework: terraform
          quiet: true
          soft_fail: true
          compact: true
          skip_checks: >-
            CKV_AWS_20
            CKV_AWS_24
            CKV_AWS_33
            CKV_AWS_117
            CKV_AWS_119
            CKV_AWS_227
            CKV_AWS_301
            CKV_AWS_302
            CKV_AWS_303
            CKV_AWS_304
            CKV_AWS_305
            CKV_AWS_306
            CKV_AWS_307
            CKV_AWS_308
            CKV_AWS_309
            CKV_AWS_310
            CKV_AWS_311
            CKV_AWS_312
            CKV_AWS_313
            CKV_AWS_314
            CKV_AWS_315
