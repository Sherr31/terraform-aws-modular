name: Terraform Plan

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "apps/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-plan.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ matrix.app }}
    runs-on: ubuntu-latest

    environment:
      name: terraform-deployment

    strategy:
      fail-fast: false
      matrix:
        app:
          - app-one
          - app-two

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`Issuer: ${payload.iss}`);
            core.info(`Audience: ${payload.aud}`);
            core.info(`Subject: ${payload.sub}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Environment: ${payload.environment}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::055111817997:role/github-actions-terraform-plan
          role-session-name: GitHubActionsTerraformPlan
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Generate Terraform Plan
        run: terraform plan -input=false -no-color
