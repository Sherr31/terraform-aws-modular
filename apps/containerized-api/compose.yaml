# apps/containerized-api/compose.yaml
#
# Local development environment for the containerized API.
#
# Usage:
#   cd apps/containerized-api
#   docker compose up -d          # Start the service
#   docker compose logs -f api    # View logs
#   curl http://localhost:8080/health  # Check health
#   docker compose down           # Stop and remove
#
# The service is configured with:
#   - Build from the local Dockerfile
#   - Port 8080 mapped to host
#   - Environment variables for configuration
#   - Health check matching the Dockerfile HEALTHCHECK

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: containerized-api
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - APP_ENV=development
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
